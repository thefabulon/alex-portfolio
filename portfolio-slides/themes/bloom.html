<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alexander Kim Portfolio · Bloom</title>
<!-- BLOOM: after the rose at Dataland. A rose drawn only in points of light, on deep plum.
     It opens a little more on every page, and photos break up into particles at their edges. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
@page { size: 1280px 720px; margin: 0; }
:root {
  --bg: #0e0612; --bg2: #1a0a20; --ink: #fbf0f8; --ink2: #e2cfe0; --mute: #9b7d98;
  --rose: #ff3fb4; --pink: #ff9ad5; --coral: #ff6a4d; --blue: #6d86ff; --rule: rgba(255, 154, 213, .2);
  --display: "Syne", sans-serif; --body: "Manrope", sans-serif; --mono: "Space Mono", monospace; --serif: "Instrument Serif", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
#deck { width: 1280px; }
.page { position: relative; width: 1280px; height: 720px; overflow: hidden; break-after: page; background: var(--bg); font-family: var(--body); }
.page > * { position: absolute; }
.page > .art { pointer-events: none; }

/* ---------- header */
.kick { left: 56px; top: 50px; display: flex; gap: 12px; align-items: center; font: 700 9.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink2); z-index: 5; }
.kick .no { color: var(--rose); display: inline-flex; align-items: center; gap: 8px; }
.kick .no::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rose); }
h1 { margin: 0; font: 700 54px/.94 var(--display); letter-spacing: -.03em; color: #fff; }
.sub { margin: 10px 0 0; font: italic 400 23px/1.05 var(--serif); color: var(--pink); }
.head { left: 56px; top: 76px; width: 370px; z-index: 5; }

/* ---------- left column */
.col { left: 56px; width: 360px; z-index: 5; display: flex; flex-direction: column; gap: 16px; }
.desc { display: flex; flex-direction: column; gap: 11px; }
.desc h4 { margin: 0 0 3px; font: 700 9px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--rose); }
.desc p { margin: 0; font: 400 12.2px/1.5 var(--body); color: var(--ink2); }
.desc .d:first-child p { font-size: 13px; color: var(--ink); }

/* ---------- media */
.media { left: 456px; top: 52px; width: 780px; height: 616px; display: grid; gap: 14px; z-index: 4; }
.fig { margin: 0; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.fig .frame { flex: 1; min-height: 0; position: relative; overflow: hidden; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 154, 213, .16); background: #000; }
.fig img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fig.contain .frame { background: #f4eef3; }
.fig.contain img { object-fit: contain; padding: 6px; }
.fig.bare .frame { background: none; box-shadow: none; overflow: visible; }
.fig.bare img { object-fit: contain; }
.fig.phone .frame { border-radius: 18px; border: 6px solid #120914; box-shadow: 0 0 0 1px rgba(255, 154, 213, .3); }
figcaption { margin-top: 6px; font: italic 400 15px/1.1 var(--serif); color: var(--pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
figcaption::before { content: "↳ "; font-style: normal; color: var(--rose); }

/* ---------- extras */
.extra h5 { margin: 0 0 8px; font: 700 9px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--rose); }
.stats { display: flex; gap: 26px; align-items: flex-end; }
.stat b { display: block; font: 800 44px/1 var(--display); letter-spacing: -.03em; color: var(--rose); }
.media .stat b { font-size: 34px; white-space: nowrap; }
.stat span { display: block; margin-top: 6px; font: 700 8.5px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); }
.media .x-stats { align-self: end; padding: 8px 0 4px; }
.media .x-stats .stats { flex-direction: column; align-items: flex-start; gap: 16px; }
[data-id="hearth"] .media .x-stats .stats { flex-direction: row; gap: 54px; padding-left: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font: 700 8.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px; border: 1px solid rgba(255, 63, 180, .55); border-radius: 20px; color: var(--ink); }
.swatches { display: flex; gap: 16px; }
.swatches div { display: flex; align-items: center; gap: 7px; font: 500 11px var(--body); color: var(--ink2); }
.swatches i { width: 14px; height: 14px; border-radius: 50%; }
.lessons { margin: 0; padding: 0; list-style: none; counter-reset: l; display: grid; gap: 7px; }
.lessons li { counter-increment: l; font: 400 11px/1.4 var(--body); color: var(--ink2); padding-left: 24px; position: relative; }
.lessons li::before { content: counter(l, decimal-leading-zero); position: absolute; left: 0; top: 1px; font: 700 9px var(--mono); color: var(--rose); }
.lessons b { color: var(--ink); font-weight: 600; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; height: 100%; }
.steps li { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.steps .frame { flex: 1; min-height: 0; overflow: hidden; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 154, 213, .16); }
.steps img { width: 100%; height: 100%; object-fit: cover; display: block; }
.steps em { font: 800 22px/1 var(--display); font-style: normal; color: var(--rose); margin-right: 8px; }
.steps b { font: 700 9px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
.steps p { margin: 4px 0 0; font: 400 10.8px/1.4 var(--body); color: var(--ink2); }
.titleblock { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); }
.titleblock div { padding: 7px 10px; border: 1px solid var(--rule); }
.titleblock span { display: block; font: 700 7.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--rose); }
.titleblock b { font: 600 11.5px var(--body); }
.role b { display: block; font: 800 22px/1 var(--display); letter-spacing: -.02em; color: #fff; }
.media .x-role { align-self: center; }
.mission { margin: 0; font: italic 400 26px/1.05 var(--serif); color: var(--pink); }
.media .x-mission { align-self: center; padding: 0 6px; }
.build { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; position: relative; }
.build::before { content: ""; position: absolute; left: 10px; right: 30px; top: 10px; border-top: 1px dashed rgba(255, 63, 180, .6); }
.build li { position: relative; }
.build em { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: var(--rose); color: #fff; font: 700 10px var(--mono); font-style: normal; }
.build b { display: block; margin-top: 8px; font: 700 13px var(--display); }
.build span { font: 400 10px/1.3 var(--body); color: var(--ink2); }
.next { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.next .frame { flex: 1; min-height: 0; overflow: hidden; border-radius: 3px; position: relative; box-shadow: 0 0 0 1px rgba(255, 154, 213, .2); }
.next img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; display: block; filter: saturate(.8); }
.next b { font: 800 26px/1 var(--display); color: #fff; }
.next p { margin: 6px 0 0; font: 400 11px/1.45 var(--body); color: var(--ink2); }
.next small { display: block; margin-top: 4px; font: italic 14px var(--serif); color: var(--pink); }
.media .x-next { display: flex; flex-direction: column; min-height: 0; }
.media .x-next .next { flex: 1; min-height: 0; }
.credit { left: 456px; bottom: 30px; font: 400 8.5px var(--mono); color: var(--mute); z-index: 5; }

/* ---------- aside: a loose line of Alex's voice */
.aside { font: italic 400 30px/1 var(--serif); color: var(--pink); z-index: 6; }

/* ---------- footer */
.foot { left: 56px; right: 44px; bottom: 22px; display: flex; justify-content: space-between; font: 700 8px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); z-index: 5; }
.foot .pg b { color: var(--rose); }

/* ---------- feature pages */
.fhead { left: 56px; top: 76px; width: 640px; z-index: 5; }
.intro { right: 44px; top: 54px; width: 470px; margin: 0; font: 400 13px/1.5 var(--body); color: var(--ink2); z-index: 5; }
.feat { left: 56px; right: 44px; top: 236px; bottom: 64px; z-index: 4; display: flex; flex-direction: column; justify-content: center; }
.feat > * { flex: none; }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.theme .screen { aspect-ratio: 1.452; overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255, 154, 213, .2); }
.theme .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
.chipstrip { display: flex; height: 10px; margin: 12px 0 14px; border-radius: 5px; overflow: hidden; }
.chipstrip i { flex: 1; }
.theme h3 { margin: 0; font: 700 28px/1 var(--display); letter-spacing: -.02em; }
.theme .mood { display: block; margin: 4px 0 8px; font: italic 20px var(--serif); color: var(--pink); }
.theme p { margin: 0; font: 400 13px/1.5 var(--body); color: var(--ink2); }
.psteps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
.psteps em { display: block; font: 800 64px/1 var(--display); font-style: normal; color: transparent; -webkit-text-stroke: 1px var(--rose); }
.psteps b { display: block; margin: 8px 0 4px; font: 700 9px var(--mono); letter-spacing: .2em; text-transform: uppercase; }
.psteps p { margin: 0; font: 400 13px/1.5 var(--body); color: var(--ink2); }
.plabel { margin: 40px 0 14px; font: 700 9px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--rose); }
.problems { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.problem { position: relative; padding: 22px 22px 52px; border-radius: 6px; background: linear-gradient(160deg, rgba(255, 63, 180, .14), rgba(255, 63, 180, .03)); box-shadow: inset 0 0 0 1px rgba(255, 154, 213, .22); }
.problem b { font: 700 20px/1.15 var(--display); }
.problem p { margin: 10px 0 0; font: 400 13px/1.5 var(--body); color: var(--ink2); }
.problem .fix strong { color: var(--ink); }
.stamp { position: absolute; right: 16px; bottom: 14px; font: 700 8.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; padding: 5px 9px; border-radius: 20px; }
.fixed .stamp { color: #0e0612; background: var(--pink); }
.open .stamp { color: var(--coral); border: 1px solid var(--coral); }
.crew { display: grid; grid-template-columns: 420px 1fr; gap: 34px; align-items: center; }
.crew .sketch .frame { aspect-ratio: 1.558; flex: none; }
.crew .sketch figcaption { white-space: normal; font-size: 18px; margin-top: 12px; }
.looks { display: flex; flex-direction: column; gap: 4px; }
.names { display: grid; grid-template-columns: 130px repeat(5, 1fr); font: 700 8.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); text-align: center; }
.look { display: grid; grid-template-columns: 130px 1fr; align-items: center; border-top: 1px solid var(--rule); padding: 6px 0; }
.look img { width: 100%; display: block; }
.look b { display: block; font: 700 19px/1 var(--display); }
.look em { font: italic 17px var(--serif); color: var(--pink); }
.board { display: flex; flex-direction: column; gap: 26px; }
.ep { display: grid; grid-template-columns: 250px 1fr; gap: 24px; }
.eh h5 { margin: 0; font: 700 9px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--rose); }
.eh h3 { margin: 6px 0 8px; font: 800 30px/1 var(--display); letter-spacing: -.02em; }
.eh p { margin: 0; font: 400 11.5px/1.45 var(--body); color: var(--ink2); }
.panels { display: grid; gap: 12px; }
.panel { margin: 0; }
.panel .frame { position: relative; aspect-ratio: 1.33; overflow: hidden; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 154, 213, .2); }
.panel img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pn { position: absolute; left: 6px; top: 6px; font: 700 8px var(--mono); padding: 3px 5px; border-radius: 3px; background: rgba(14, 6, 18, .8); color: var(--pink); }
.panel figcaption { white-space: normal; font: 400 10.5px/1.35 var(--body); color: var(--ink2); margin-top: 6px; }
.panel figcaption::before { content: none; }
.memorial { right: 44px; top: 44px; width: 128px; z-index: 6; transform: rotate(3deg); }
.memorial img { width: 100%; display: block; border-radius: 3px; box-shadow: 0 0 0 4px #fbf0f8; }

/* ---------- cover */
.cv-kick { left: 56px; top: 50px; font: 700 9.5px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--ink2); z-index: 5; }
.cv-title { left: 50px; top: 300px; z-index: 5; margin: 0; font: 800 112px/.84 var(--display); letter-spacing: -.045em; color: #fff; }
.cv-port { left: 58px; top: 236px; z-index: 5; font: italic 400 46px/1 var(--serif); color: var(--pink); }
.cv-sub { left: 58px; top: 500px; z-index: 5; font: italic 400 24px var(--serif); color: var(--ink2); }
.cv-toc { left: 58px; bottom: 54px; z-index: 5; display: grid; grid-template-columns: repeat(3, 170px); gap: 4px 18px; font: 400 9.5px/1.35 var(--mono); color: var(--ink2); }
.cv-toc b { color: var(--rose); margin-right: 6px; }
.cv-note { right: 44px; bottom: 54px; width: 270px; z-index: 5; font: italic 400 15px/1.3 var(--serif); color: var(--ink2); text-align: right; }
.cv-note b { font: 700 8px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--rose); display: block; margin-bottom: 6px; font-style: normal; }
.cv-strip { right: 44px; top: 50px; display: flex; gap: 8px; z-index: 5; }
.cv-strip .fig { width: 92px; height: 64px; }
.cv-strip figcaption { display: none; }
</style>
</head>
<body>
<div id="deck"></div>
<script src="content.js"></script>
<script src="shared.js"></script>
<script>
/* Where the rose sits on each page: [x, y, radius, drift angle]. It moves around the deck like a
   projection drifting across a room. */
const ROSE_SPOTS = [
  [905, 360, 330, Math.PI * 1.05],   // cover
  [250, 735, 250, -1.1], [1240, 30, 200, 2.4], [1210, 690, 210, -2.3], [-20, 720, 260, -0.8],
  [1250, 690, 220, -2.6], [250, 735, 250, -1.2], [-30, 40, 220, 0.6], [1260, 720, 220, -2.4],
  [235, 740, 240, -1.0], [250, 730, 260, -1.3], [-20, -20, 230, 0.7], [1260, 700, 220, -2.5],
  [240, 740, 250, -1.0], [1240, 20, 200, 2.3], [1240, 700, 210, -2.4], [250, 735, 250, -1.2],
  [-20, 30, 220, 0.6], [240, 740, 250, -1.1], [640, 760, 300, -1.57],
];

const T = {
  page(p, n) {
    const foot = `<div class="foot"><span>Alexander Kim · Portfolio · Bloom</span><span class="pg"><b>${pad2(n)}</b> / ${TOTAL}</span></div>`;
    const kick = `<div class="kick"><span class="no">${pad2(n)}</span><span>${esc(p.cat || "")}</span></div>`;
    if (p.kind === "cover") {
      const toc = CONTENTS.map(([k, t]) => `<div><b>${pad2(k)}</b>${esc(t)}</div>`).join("");
      return `<section class="page cover" data-id="cover">
        <div class="cv-kick">${esc(p.kicker)}</div>
        <div class="cv-port">Portfolio</div>
        <h1 class="cv-title">Alexander<br>Kim</h1>
        <div class="cv-sub">${esc(p.sub)}</div>
        <div class="cv-toc">${toc}</div>
        <div class="cv-note"><b>This edition · Bloom</b>A rose made only of light, after the one I saw at Dataland. It opens a little more on every page.</div>
      </section>`;
    }
    if (p.kind === "feature") {
      return `<section class="page feature" data-id="${p.id}">
        ${kick}<div class="fhead"><h1>${esc(p.title)}</h1></div>
        ${p.intro ? `<p class="intro">${esc(p.intro)}</p>` : ""}
        <div class="feat">${featureHTML(p)}</div>
        ${p.memorial ? `<div class="memorial"><img src="${p.memorial.src}" alt="${esc(p.memorial.alt)}"></div>` : ""}
        ${p.aside ? `<div class="aside fa">${esc(p.aside)}</div>` : ""}
        ${foot}</section>`;
    }
    const [grid, loose] = mediaHTML(p, "tall");
    return `<section class="page project" data-id="${p.id}">
      ${kick}
      <div class="head"><h1>${esc(p.title)}</h1>${p.sub ? `<p class="sub">${esc(p.sub)}</p>` : ""}</div>
      <div class="col">${descHTML(p)}${loose}</div>
      ${grid}
      ${p.aside ? `<div class="aside">${esc(p.aside)}</div>` : ""}
      ${p.credit ? `<div class="credit">${esc(p.credit)}</div>` : ""}
      ${foot}</section>`;
  },

  async decorate(page, p, n) {
    // the left column starts under the header, wherever the title wrapped to
    fitText(page.querySelector(".head h1"), 372, 112, 30);
    fitText(page.querySelector(".fhead h1"), 620, 62, 30);
    const head = page.querySelector(".head, .fhead");
    const feat = page.querySelector(".feat"), intro = page.querySelector(".intro");
    if (feat) feat.style.top = Math.max(head.offsetTop + head.offsetHeight, intro ? intro.offsetTop + intro.offsetHeight : 0) + 34 + "px";
    const col = page.querySelector(".col");
    if (head && col) col.style.top = (head.offsetTop + head.offsetHeight + 26) + "px";
    if (col && col.offsetTop + col.offsetHeight > 668) col.style.gap = "10px";
    // Fishy: the loose note sits in the empty 4th panel slot of episode 1
    const fa = page.querySelector(".fa"), short = [...page.querySelectorAll(".panels")].find(x => x.children.length < 4);
    if (fa && short) {
      const pr = page.getBoundingClientRect(), last = short.lastElementChild.getBoundingClientRect();
      Object.assign(fa.style, { left: (last.right - pr.left + 24) + "px", top: (last.top - pr.top + 40) + "px", width: "200px", transform: "rotate(-4deg)" });
    }
    if (p.memorial) page.querySelector(".intro").style.right = "200px";
    const aside = page.querySelector(".project .aside, [data-id=hearth] .aside");
    if (p.id === "hearth" && aside) Object.assign(aside.style, { left: "1000px", top: "70px", transform: "rotate(-5deg)" });

    // background: plum glow + bokeh + the rose, baked to one JPEG
    const [rx, ry, R, ang] = ROSE_SPOTS[n - 1];
    const open = n === 1 || n === TOTAL ? 1 : 0.12 + 0.88 * (n - 2) / (TOTAL - 3);
    art(page, [0, 0, PW, PH], (ctx, w, h) => {
      ctx.fillStyle = "#0e0612"; ctx.fillRect(0, 0, w, h);
      let g = ctx.createRadialGradient(rx, ry, 0, rx, ry, R * 2.6);
      g.addColorStop(0, "rgba(120,18,80,.55)"); g.addColorStop(.45, "rgba(60,10,52,.35)"); g.addColorStop(1, "rgba(14,6,18,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      g = ctx.createRadialGradient(w * .7, h * .2, 0, w * .7, h * .2, w * .7);
      g.addColorStop(0, "rgba(70,20,90,.25)"); g.addColorStop(1, "rgba(14,6,18,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      drawBokeh(ctx, w, h, { seed: n * 17, count: n === 1 ? 46 : 22, alpha: n === 1 ? 0.3 : 0.16 });
      drawRose(ctx, rx, ry, R, { seed: 100 + n, open, rotate: n * 0.7, density: n === 1 ? 1.5 : 1,
        drift: { angle: ang, length: n === 1 ? 900 : 620, count: n === 1 ? 4200 : 2200, wave: 0.8 } });
    }, { asJpeg: true, scale: 1.6, quality: 0.84, cls: "art bg" });

    // photos on the far right break up into light
    const media = page.querySelector(".media");
    if (media) {
      const mr = media.getBoundingClientRect();
      page.querySelectorAll(".media .fig:not(.contain):not(.bare):not(.phone)").forEach((f, i) => {
        const b = f.querySelector(".frame").getBoundingClientRect();
        if (mr.right - b.right < 3) dissolveFig(page, f, { side: "right", reach: 42, seed: n * 10 + i, keep: 0.8 });
      });
    }
  },
};
build(T);
</script>
</body>
</html>
