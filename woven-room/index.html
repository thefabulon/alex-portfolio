<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Woven Room</title>
<meta name="description" content="A VR gallery room: Gunta Stölzl's 1927/28 Bauhaus tapestry hung in folds like El Anatsui's metal cloth, with high-shine sculptures inspired by The Broad. Works in a headset or a browser.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Big+Shoulders+Display:wght@800&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen WebGL room, no panel. Controls live on things in the room (see the UI section). */
  :root {
    --ink: #1d2329; --muted: #5b646c; --red: #c8352b; --paper: #f4f3ef;
    --display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #f2f1ed; color: var(--ink); font-family: var(--body); overflow: hidden; }
  canvas { display: block; touch-action: none; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 400 13px var(--mono); color: #566673; pointer-events: none; }
  .back { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 5;
    font: 400 11px var(--mono); letter-spacing: .04em; color: var(--muted); text-decoration: none; text-shadow: 0 0 6px #f4f3ef, 0 0 2px #f4f3ef; }
  .back a { color: inherit; text-decoration: none; }
  .back a:hover { color: var(--ink); }
  /* Version C, touch: no menus at all. The things in the room are the switches. Hover tells you what a click will do,
     a caption says what happened, and a small tally keeps track of what you've found. */
  .hint { position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; padding: 5px 9px; background: var(--ink); color: var(--paper);
    font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; opacity: 0; transition: opacity .12s; }
  .hint.on { opacity: 1; }
  .hint small { display: block; font: 400 10px var(--mono); letter-spacing: .02em; text-transform: none; color: #b9c0c6; margin-top: 1px; }
  .caption { position: fixed; left: 50%; bottom: 74px; transform: translate(-50%, 8px); z-index: 4; width: max-content; max-width: min(460px, calc(100vw - 32px));
    box-sizing: border-box; padding: 10px 16px 11px; background: var(--paper); box-shadow: 0 10px 30px rgba(29, 35, 41, .2);
    color: var(--ink); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
  .caption.on { opacity: 1; transform: translate(-50%, 0); }
  .caption .eyebrow { font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
  .caption b { display: block; font: 800 24px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; margin-top: 2px; }
  .caption p { margin: 3px 0 0; font-size: 13px; line-height: 1.45; }
  .tally { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 18px; z-index: 4; }
  .tally > button { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); cursor: pointer;
    background: rgba(244, 243, 239, .9); border: 1px solid rgba(29, 35, 41, .2); padding: 7px 10px; }
  .tally > button:hover { border-color: var(--ink); }
  .tally > button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .tally ol { position: absolute; left: 0; bottom: calc(100% + 6px); width: 290px; margin: 0; padding: 12px 14px; list-style: none; display: grid; gap: 7px;
    background: var(--paper); box-shadow: 0 10px 30px rgba(29, 35, 41, .2); font-size: 12.5px; line-height: 1.4; }
  .tally ol[hidden] { display: none; }
  .tally li { display: grid; grid-template-columns: 18px 1fr; color: var(--muted); }
  .tally li::before { content: "○"; color: var(--muted); }
  .tally li.found { color: var(--ink); }
  .tally li.found::before { content: "●"; color: var(--red); }
  .tally .keys { grid-template-columns: 1fr; font: 400 10.5px/1.5 var(--mono); border-top: 1px solid rgba(29, 35, 41, .15); padding-top: 7px; }
  .tally .keys::before { content: none; }
  .intro { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 3; width: max-content; max-width: calc(100vw - 32px);
    box-sizing: border-box; padding: 10px 16px; background: var(--paper); box-shadow: 0 8px 26px rgba(29, 35, 41, .18);
    font: 400 12px/1.5 var(--mono); text-align: center; transition: opacity .6s; }
  .intro b { display: block; font: 800 24px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin-bottom: 4px; }
  .intro.gone { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) { .caption, .intro { bottom: 120px; } .tally { bottom: 72px; } }
</style>
</head>
<body>
<div class="loading" id="loading">Hanging the tapestry…</div>
<nav class="back" aria-label="Leave the room"><a href="../index.html">← Lobby</a></nav>
<div class="hint" id="hint"></div>
<div class="caption" id="caption" role="status" aria-live="polite"></div>
<div class="tally"><button id="tallyBtn" aria-expanded="false">0 / 7 found</button><ol id="tallyList" hidden></ol></div>
<div class="intro" id="intro"><b>The Woven Room</b>Nothing here has a button. Click the art itself and see what happens.</div>

<script src="tapestry.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRButton } from "three/addons/webxr/VRButton.js";
import { XRControllerModelFactory } from "three/addons/webxr/XRControllerModelFactory.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ui = {}; // filled in by the UI section at the bottom: ready, hover, hoverMove, pick, state, frame, close
const coarse = matchMedia("(pointer: coarse)").matches;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType("local-floor"); // a standing gallery: y = 0 is your real floor
document.body.prepend(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2f1ed);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 120);
const rig = new THREE.Group(); // the visitor: camera + controllers ride in here
rig.add(camera); scene.add(rig);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxDistance = 16; controls.minDistance = 1.5;

/* ---------- the room. Meters; the tapestry wall is at -Z, the door at +Z ---------- */
const ROOM = { hw: 5.5, hd: 8, h: 10.2, sky: 1.2 }; // half width, half depth, height to the ceiling fins, fin depth
const WALL_Z = -ROOM.hd;
const IMG = window.TAPESTRY_IMG;
const TAP_H = 9, TAP_W = TAP_H * IMG.w / IMG.h, TAP_TOP = 9.9, TAP_Z = WALL_Z + 0.55, TAP_BOTTOM = TAP_TOP - TAP_H;
const EYE = 1.6;

function paint(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function add(parent, obj, x = 0, y = 0, z = 0) { obj.position.set(x, y, z); parent.add(obj); return obj; }
function box(w, h, d, m) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.castShadow = o.receiveShadow = true; return o; }

/* ---------- things you can click. Every mesh carries the "target" it belongs to; the UI decides what a click does ---------- */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const pickables = [];
function tag(obj, target) { obj.traverse(o => { if (o.isMesh) o.userData.target = target; }); pickables.push(obj); return obj; }
const TARGETS = {
  floor: { id: "floor" },
  wall: { id: "wall" },
  ceiling: { id: "ceiling", name: "The veil ceiling", anchor: V3(0, ROOM.h - 0.4, 1.5) },
  door: { id: "door", name: "The door", note: "The way out. It leads back to the lobby.", anchor: V3(0, 2.3, ROOM.hd - 0.1) },
};

// Polished concrete, the long pale floor of The Broad.
const floorTex = paint(512, 512, (x, w, h) => {
  x.fillStyle = "#d3d0ca"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { x.fillStyle = Math.random() < 0.5 ? "rgba(90,86,80,.07)" : "rgba(255,255,255,.12)"; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  x.strokeStyle = "rgba(120,116,110,.35)"; x.lineWidth = 2; x.strokeRect(0, 0, w, h);
}, [3, 4.5]);

const mat = {
  wall: new THREE.MeshStandardMaterial({ color: 0xeeede8, roughness: 0.95, envMapIntensity: 0.25 }),
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.3, envMapIntensity: 0.7 }),
  fin: new THREE.MeshStandardMaterial({ color: 0xf7f7f4, roughness: 0.9, envMapIntensity: 0.4 }),
  plinth: new THREE.MeshStandardMaterial({ color: 0xf7f7f5, roughness: 0.55, envMapIntensity: 0.5 }),
  sky: new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 2.2, 2.15) }),
  steel: new THREE.MeshStandardMaterial({ color: 0xd9dde1, metalness: 1, roughness: 0.15 }),
};

const room = new THREE.Group(); scene.add(room);
{
  const floor = add(room, new THREE.Mesh(new THREE.PlaneGeometry(ROOM.hw * 2, ROOM.hd * 2), mat.floor));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; tag(floor, TARGETS.floor);
  const H = ROOM.h + ROOM.sky, T = 0.3;
  const wall = (w, h, d, x, y, z) => { const m = add(room, box(w, h, d, mat.wall), x, y, z); m.castShadow = false; return tag(m, TARGETS.wall); };
  wall(ROOM.hw * 2 + 2 * T, H, T, 0, H / 2, WALL_Z - T / 2);                // tapestry wall
  wall(T, H, ROOM.hd * 2, -ROOM.hw - T / 2, H / 2, 0);                      // left
  wall(T, H, ROOM.hd * 2, ROOM.hw + T / 2, H / 2, 0);                       // right
  // Door wall: the way back to the lobby.
  const DW = 1.8, DH = 3;
  wall(ROOM.hw - DW / 2, H, T, -(ROOM.hw + DW / 2) / 2, H / 2, ROOM.hd + T / 2);
  wall(ROOM.hw - DW / 2, H, T, (ROOM.hw + DW / 2) / 2, H / 2, ROOM.hd + T / 2);
  wall(DW, H - DH, T, 0, DH + (H - DH) / 2, ROOM.hd + T / 2);
  tag(add(room, new THREE.Mesh(new THREE.PlaneGeometry(DW, DH), mat.sky), 0, DH / 2, ROOM.hd + 1.4), TARGETS.door).rotation.y = Math.PI;
  for (const s of [-1, 1]) tag(wall(0.05, DH, 1.4, s * DW / 2, DH / 2, ROOM.hd + 0.7), TARGETS.door);
  tag(wall(DW, 0.05, 1.4, 0, DH, ROOM.hd + 0.7), TARGETS.door);

  // The "veil" ceiling: deep white fins in a grid with daylight above them.
  const sky = add(room, new THREE.Mesh(new THREE.PlaneGeometry(ROOM.hw * 2, ROOM.hd * 2), mat.sky), 0, H, 0);
  sky.rotation.x = Math.PI / 2;
  tag(add(room, new THREE.Mesh(new THREE.PlaneGeometry(ROOM.hw * 2, ROOM.hd * 2), new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })), 0, ROOM.h, 0), TARGETS.ceiling).rotation.x = Math.PI / 2;
  const finGeoZ = new THREE.BoxGeometry(0.08, ROOM.sky, ROOM.hd * 2), finGeoX = new THREE.BoxGeometry(ROOM.hw * 2, ROOM.sky, 0.08);
  for (let x = -ROOM.hw + 1.5; x < ROOM.hw - 0.1; x += 1.5) add(room, new THREE.Mesh(finGeoZ, mat.fin), x, ROOM.h + ROOM.sky / 2, 0);
  for (let z = -ROOM.hd + 1.5; z < ROOM.hd - 0.1; z += 1.5) add(room, new THREE.Mesh(finGeoX, mat.fin), 0, ROOM.h + ROOM.sky / 2, z);
}

/* ---------- light: soft daylight from the ceiling, one raking light so the folds read ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0xbdb7ac, 1.15));
const sun = new THREE.DirectionalLight(0xfff6ea, 2.6);
sun.position.set(-8.5, 12, -0.5); sun.target.position.set(0, 3.5, -5.5);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 11, bottom: -10, near: 1, far: 36 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xf2f5ff, 0.9); fill.position.set(9, 8, 4); scene.add(fill); // so the shaded side wall stays gallery-white

/* ---------- the tapestry: a flat photo, folded on the GPU so it hangs like El Anatsui's metal ---------- */
// One fold function, written twice (GLSL for the cloth, JS for the fringe) so the fringe stays attached.
// p.x runs across the tapestry from its center, p.y runs up from its bottom edge, in meters.
const WEAVE_GLSL = `
uniform float uTime; uniform float uFold; uniform vec2 uSize;
varying vec3 vTanX; varying vec3 vTanY;
float weaveD(vec2 p) {
  float x = p.x, y = p.y, t = uTime;
  float hang = smoothstep(0.0, 0.9, uSize.y - y);
  float folds = (0.6 * sin(x * 5.4 + 1.1 * sin(y * 0.55 + 0.4) + 0.5 * sin(y * 1.3 + x) + 0.35 * sin(t * 0.5))
              + 0.4 * sin(x * 2.3 - y * 0.4 + 0.6 * sin(t * 0.31 + y * 0.2))) * (0.16 + 0.06 * sin(y * 0.8 + 1.0));
  float billow = 0.24 * sin(x * 0.95 - y * 0.32 + t * 0.32) * (0.6 + 0.4 * sin(y * 0.45 + 2.0));
  float crumple = 0.035 * sin(x * 11.0 + y * 7.0 + t * 0.9) * sin(y * 9.0 - x * 5.0 - t * 0.6);
  return uFold * hang * (folds + billow + crumple);
}`;
function weaveD(x, y, t, fold) {
  const S = Math.sin;
  const hang = THREE.MathUtils.smoothstep(TAP_H - y, 0, 0.9);
  const folds = (0.6 * S(x * 5.4 + 1.1 * S(y * 0.55 + 0.4) + 0.5 * S(y * 1.3 + x) + 0.35 * S(t * 0.5))
              + 0.4 * S(x * 2.3 - y * 0.4 + 0.6 * S(t * 0.31 + y * 0.2))) * (0.16 + 0.06 * S(y * 0.8 + 1.0));
  const billow = 0.24 * S(x * 0.95 - y * 0.32 + t * 0.32) * (0.6 + 0.4 * S(y * 0.45 + 2.0));
  const crumple = 0.035 * S(x * 11.0 + y * 7.0 + t * 0.9) * S(y * 9.0 - x * 5.0 - t * 0.6);
  return fold * hang * (folds + billow + crumple);
}

const weave = {
  time: { value: reduceMotion ? 0 : 2 }, fold: { value: 1 }, metal: { value: 0 },
  size: { value: new THREE.Vector2(TAP_W, TAP_H) }, cells: { value: new THREE.Vector2(60, Math.round(110 * TAP_H / TAP_W)) },
};
function hookWeave(shader, full) {
  Object.assign(shader.uniforms, { uTime: weave.time, uFold: weave.fold, uSize: weave.size, uMetal: weave.metal, uCells: weave.cells });
  shader.vertexShader = shader.vertexShader
    .replace("#include <common>", "#include <common>\n" + WEAVE_GLSL)
    .replace("#include <begin_vertex>", "vec3 transformed = vec3(position.xy, weaveD(vec2(position.x, position.y + uSize.y * 0.5)));");
  if (!full) return;
  shader.vertexShader = shader.vertexShader.replace("#include <beginnormal_vertex>", `
    vec2 np = vec2(position.x, position.y + uSize.y * 0.5);
    float d0 = weaveD(np), gx = (weaveD(np + vec2(0.02, 0.0)) - d0) / 0.02, gy = (weaveD(np + vec2(0.0, 0.02)) - d0) / 0.02;
    vec3 objectNormal = normalize(vec3(-gx, -gy, 1.0));
    vTanX = normalize(normalMatrix * vec3(1.0, 0.0, gx)); vTanY = normalize(normalMatrix * vec3(0.0, 1.0, gy));
    #ifdef USE_TANGENT
    vec3 objectTangent = vec3(tangent.xyz);
    #endif`);
  // Metal mode: the weave breaks into little tilted plates joined by copper wire, like bottle caps.
  shader.fragmentShader = shader.fragmentShader
    .replace("#include <common>", `#include <common>
      uniform float uMetal; uniform vec2 uCells; varying vec3 vTanX; varying vec3 vTanY;
      vec2 cellHash(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }`)
    .replace("#include <map_fragment>", `#include <map_fragment>
      vec2 cuv = vMapUv * uCells; float row = floor(cuv.y);
      cuv.x = cuv.x * (0.7 + 0.6 * cellHash(vec2(row, 3.0)).x) + 4.0 * cellHash(vec2(row, 9.0)).y; // rows of uneven, staggered strips
      vec2 cf = fract(cuv), cid = floor(cuv);
      float wire = 1.0 - smoothstep(0.015, 0.06, min(min(cf.x, 1.0 - cf.x), min(cf.y, 1.0 - cf.y)));
      diffuseColor.rgb = mix(diffuseColor.rgb, mix(diffuseColor.rgb * (0.95 + 0.3 * cellHash(cid + 3.0).x), vec3(0.55, 0.3, 0.14), wire * 0.8), uMetal);`)
    .replace("#include <roughnessmap_fragment>", `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, roughnessFactor * (0.5 + cellHash(cid + 7.0).x), uMetal);`)
    .replace("#include <normal_fragment_maps>", `#include <normal_fragment_maps>
      vec2 tilt = cellHash(cid) - 0.5;
      normal = normalize(normal + uMetal * 0.9 * (tilt.x * vTanX + tilt.y * vTanY));`);
}

let texReady;
const tapTex = new THREE.TextureLoader().load(IMG.src, () => texReady());
const texLoaded = new Promise(r => { texReady = r; });
tapTex.colorSpace = THREE.SRGBColorSpace; tapTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const tapMat = new THREE.MeshStandardMaterial({ map: tapTex, roughness: 0.92, metalness: 0, envMapIntensity: 0.45 });
tapMat.onBeforeCompile = s => hookWeave(s, true);
tapMat.customProgramCacheKey = () => "weave";
const tapDepth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
tapDepth.onBeforeCompile = s => hookWeave(s, false);
tapDepth.customProgramCacheKey = () => "weave-depth";

const tapestry = add(scene, new THREE.Mesh(new THREE.PlaneGeometry(TAP_W, TAP_H, 150, 205), tapMat), 0, TAP_BOTTOM + TAP_H / 2, TAP_Z);
tapestry.customDepthMaterial = tapDepth;
tapestry.castShadow = tapestry.receiveShadow = true;
tapestry.frustumCulled = false; // the folds move it off its flat bounding box
TARGETS.weave = { id: "weave", name: "The tapestry", note: "Gunta Stölzl, Slit Tapestry Red-Green, 1927/28", anchor: V3(TAP_W / 2 - 0.3, 7.2, TAP_Z + 0.5) };
TARGETS.rod = { id: "rod", parent: "weave", name: "The hanging rod", anchor: V3(TAP_W / 2 - 0.4, TAP_TOP, TAP_Z + 0.2) };
TARGETS.fringe = { id: "fringe", parent: "weave", name: "The fringe", anchor: V3(TAP_W / 2 - 0.6, TAP_BOTTOM - 0.4, TAP_Z + 0.3) };
const hitMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
tag(add(scene, new THREE.Mesh(new THREE.PlaneGeometry(TAP_W, TAP_H - 0.25), hitMat), 0, TAP_BOTTOM + (TAP_H + 0.25) / 2, TAP_Z + 0.12), TARGETS.weave);
tag(add(scene, new THREE.Mesh(new THREE.PlaneGeometry(TAP_W, 1.05), hitMat), 0, TAP_BOTTOM - 0.4, TAP_Z + 0.15), TARGETS.fringe);

// Hanging rod and wall brackets.
{
  const rod = add(scene, new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, TAP_W + 0.5, 20), mat.steel), 0, TAP_TOP + 0.03, TAP_Z);
  rod.rotation.z = Math.PI / 2; rod.castShadow = true;
  tag(add(scene, new THREE.Mesh(new THREE.BoxGeometry(TAP_W + 0.6, 0.5, 0.5), hitMat), 0, TAP_TOP + 0.03, TAP_Z), TARGETS.rod); // fat stand-in so the thin rod is easy to hit
  for (const s of [-1, 1]) add(scene, box(0.05, 0.05, TAP_Z - WALL_Z, mat.steel), s * (TAP_W / 2 + 0.15), TAP_TOP + 0.03, (TAP_Z + WALL_Z) / 2);
}

// The fringe: real strands, so it can sway under the folds.
const FR_N = 190, FR_LEN = 0.75;
const strandGeo = new THREE.BoxGeometry(0.02, FR_LEN, 0.008); strandGeo.translate(0, -FR_LEN / 2, 0);
const fringeMat = new THREE.MeshStandardMaterial({ color: 0xe6dcc3, roughness: 0.95, envMapIntensity: 0.4 });
const fringe = add(scene, new THREE.InstancedMesh(strandGeo, fringeMat, FR_N));
fringe.castShadow = true; fringe.frustumCulled = false;
const strands = Array.from({ length: FR_N }, (_, i) => ({
  x: -TAP_W / 2 + (i + 0.5) * TAP_W / FR_N + (Math.random() - 0.5) * 0.012,
  len: 0.88 + Math.random() * 0.17, ph: Math.random() * 6.28,
}));
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
let sway = 0, clockT = 0;
function updateFringe() {
  const t = weave.time.value, f = weave.fold.value;
  strands.forEach((s, i) => {
    const d = weaveD(s.x, 0, t, f), slope = (weaveD(s.x, 0.05, t, f) - d) / 0.05;
    _p.set(s.x, TAP_BOTTOM + 0.01, TAP_Z + d);
    _e.set(-slope * 0.5 + sway * 0.07 * Math.sin(clockT * 1.3 + s.ph), 0, sway * 0.04 * Math.sin(clockT * 0.9 + s.ph * 1.7));
    _m.compose(_p, _q.setFromEuler(_e), _s.set(1, s.len, 1));

  const btn = (gp, i) => !!gp?.buttons[i]?.pressed;
  const dz = v => (Math.abs(v) < 0.15 ? 0 : v);
  const L = pads.left, R = pads.right, [lx, ly] = stick(L), [rx] = stick(R);

  camera.getWorldDirection(_dir).setY(0).normalize();
  rig.position.x += (_dir.x * -dz(ly) - _dir.z * dz(lx)) * 1.6 * dt;
  rig.position.z += (_dir.z * -dz(ly) + _dir.x * dz(lx)) * 1.6 * dt;

  if (Math.abs(rx) > 0.6 && !turnHeld) {
    turnHeld = true;
    const a = -Math.sign(rx) * Math.PI / 6; camera.getWorldPosition(_head);
    rig.position.sub(_head).applyAxisAngle(UP, a).add(_head); rig.rotation.y += a;
  } else if (Math.abs(rx) < 0.3) turnHeld = false;

  camera.getWorldPosition(_head);
  const [cx, cz] = collide(_head.x, _head.z, 0.3);
  rig.position.x += cx - _head.x; rig.position.z += cz - _head.z;

  if (pressedOnce("A", btn(R, 4))) setState("metal", 1 - state.metal);
  if (pressedOnce("B", btn(R, 5))) setState("fold", 1 - state.fold);
  if (pressedOnce("X", btn(L, 4))) setState("breathe", 1 - state.breathe);
  if (pressedOnce("Y", btn(L, 5))) goTo("Door");
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const thread = new THREE.Color(0xe6dcc3), copper = new THREE.Color(0xb8743f);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), ease = 1 - Math.pow(0.03, dt);
  clockT += dt;
  if (renderer.xr.isPresenting) readVR(dt);
  else if (state.view === "walk") walkStep(dt);
  else {
    controls.update();
    camera.position.set(THREE.MathUtils.clamp(camera.position.x, -ROOM.hw + 0.3, ROOM.hw - 0.3), THREE.MathUtils.clamp(camera.position.y, 0.4, ROOM.h - 0.3),
      THREE.MathUtils.clamp(camera.position.z, TAP_Z + 0.6, ROOM.hd - 0.3));
  }

  // Ease every switch so you see the change happen, not a jump cut.
  const m = weave.metal.value += (state.metal - weave.metal.value) * ease;
  weave.fold.value += (state.fold - weave.fold.value) * ease;
  sway += (state.breathe - sway) * ease;
  weave.time.value += dt * sway;
  tapMat.metalness = 0.85 * m; tapMat.roughness = 0.92 - 0.7 * m; tapMat.envMapIntensity = 0.45 + 1.1 * m;
  fringeMat.color.copy(thread).lerp(copper, m); fringeMat.metalness = 0.9 * m; fringeMat.roughness = 0.95 - 0.6 * m;
  updateFringe();
  if (!renderer.xr.isPresenting) { updateHover(); ui.frame?.(dt); }

  renderer.render(scene, camera);
});

/* ---------- UI: the room itself is the controls ---------- */
const clamp = THREE.MathUtils.clamp;
// Version C: touch. The tapestry, its rod, its fringe, the ceiling and the door are the switches.
// FIND lists what there is to discover; each line shows a riddle until you find it, then what it does.
const FIND = [
  ["metal", "Something on the far wall turns to metal.", "The tapestry: thread ↔ metal"],
  ["fold", "Something up high holds the folds.", "The hanging rod: folded ↔ flat"],
  ["breathe", "Something near the floor can breathe.", "The fringe: breathing ↔ still"],
  ["above", "Look up.", "The ceiling: see the room from above"],
  ["sculpture", "The shiny things came from somewhere.", "A sculpture: walk to it and see where it's from"],
  ["story", "There's a story on one of the walls.", "The story wall: read it up close"],
  ["door", "Find the way out.", "The door: back to the lobby"],
];
const found = new Set();
const $ = id => document.getElementById(id);
const hint = $("hint"), caption = $("caption"), intro = $("intro"), tallyBtn = $("tallyBtn"), tallyList = $("tallyList");
function drawTally() {
  tallyBtn.textContent = found.size === FIND.length ? "All 7 found" : `${found.size} / ${FIND.length} found`;
  tallyList.replaceChildren(...FIND.map(([k, riddle, answer]) => {
    const li = document.createElement("li"); li.textContent = found.has(k) ? answer : riddle; li.classList.toggle("found", found.has(k)); return li;
  }));
  const keys = document.createElement("li"); keys.className = "keys";
  keys.textContent = "Drag to look · W A S D to walk · click the floor to walk there · keys M F B work too. Headset: A metal, B folds, X breathing, Y the door.";
  tallyList.append(keys);
}
tallyBtn.addEventListener("click", () => { tallyList.hidden = !tallyList.hidden; tallyBtn.setAttribute("aria-expanded", String(!tallyList.hidden)); });
drawTally();
function discover(k) { if (found.has(k)) return; found.add(k); drawTally(); tallyBtn.animate?.([{ background: "#c8352b", color: "#f4f3ef" }, {}], { duration: 900 }); }

let capTimer;
function say(eyebrow, title, text) {
  caption.innerHTML = ""; intro.classList.add("gone");
  const e = el("div", "eyebrow", eyebrow), b = el("b", null, title); caption.append(e, b);
  if (text) caption.append(el("p", null, text));
  caption.classList.add("on");
  clearTimeout(capTimer); capTimer = setTimeout(() => caption.classList.remove("on"), 5200);
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// What a click on each thing will do, said before you click it.
function verb(t) {
  switch (t.id) {
    case "weave": return state.metal ? ["Turn it back to thread", "the tapestry"] : ["Turn it to metal", "the tapestry"];
    case "rod": return state.fold ? ["Let it hang flat", "the hanging rod"] : ["Fold it again", "the hanging rod"];
    case "fringe": return state.breathe ? ["Hold it still", "the fringe"] : ["Let it breathe", "the fringe"];
    case "ceiling": return state.view === "orbit" ? ["Come back down", "the veil ceiling"] : ["See the room from above", "the veil ceiling"];
    case "sculpture": return [`Walk to ${t.name}`, "sculpture"];
    case "shine": return ["Go see the sculptures", "wall label"];
    case "label": return ["Read it up close", "wall label"];
    case "story": return ["Read the story", "the story wall"];
    case "door": return ["Leave the room", "the door"];
    case "floor": return ["Walk here", ""];
  }
  return null;
}
let doorArmed = 0;
ui.pick = t => {
  if (!t) return;
  switch (t.id) {
    case "weave": setState("metal", 1 - state.metal); break;
    case "rod": setState("fold", 1 - state.fold); break;
    case "fringe": setState("breathe", 1 - state.breathe); break;
    case "ceiling": setState("view", state.view === "orbit" ? "walk" : "orbit"); break;
    case "sculpture": discover("sculpture"); goTo(t.spot); say("Sculpture · Alex, 2026", t.name, "From the tapestry: " + t.note); break;
    case "shine": discover("sculpture"); goTo("Shine"); say("Alex, 2026", "Pulled from the weave", "Wave, Arch, Windows and Diamonds: four shapes lifted off the tapestry. Click one to walk to it."); break;
    case "label": goTo("Weave"); say("After the Bauhaus", "Gunta Stölzl", "Slit Tapestry Red-Green, 1927/28. Try clicking the tapestry, its rod, and its fringe."); break;
    case "story": discover("story"); goTo("Story"); say("Process", "Solid, but it moves", "The story behind the room, written on the wall."); break;
    case "door":
      discover("door");
      if (performance.now() - doorArmed < 5000) { location.href = "../index.html"; return; }
      doorArmed = performance.now();
      say("Exit", "The door", "This door leads back to the lobby. Click it again to go.");
      break;
  }
  if (hovered) ui.hover(hovered); // the hint now says the opposite
};
ui.state = (k, v) => {
  if (k === "metal") { discover("metal"); say("The tapestry", v ? "Metal" : "Thread", v ? "Little tilted plates joined by copper wire, like El Anatsui's bottle caps. Walk past it and watch the light move." : "Back to Stölzl's wool. Click it again for metal."); }
  if (k === "fold") { discover("fold"); say("The hanging rod", v ? "Folded" : "Flat", v ? "Hung in deep folds, the way El Anatsui hangs his metal." : "The flat photo from the book. Click the rod again to fold it."); }
  if (k === "breathe") { discover("breathe"); say("The fringe", v ? "Breathing" : "Still", v ? "The folds slowly drift." : "Everything holds still. Click the fringe again to let it breathe."); }
  if (k === "view") { if (v === "orbit") { discover("above"); say("The veil ceiling", "From above", "Drag to spin around the room. Click the ceiling again, or press W, to walk."); } }
};
ui.ready = () => setTimeout(() => intro.classList.add("gone"), 10000);
ui.hover = t => {
  const v = t && verb(t);
  hint.replaceChildren();
  if (!v) { hint.classList.remove("on"); return; }
  hint.append(v[0]); if (v[1]) hint.append(el("small", null, v[1]));
  hint.classList.add("on");
};
ui.hoverMove = (t, x, y) => { hint.style.transform = `translate(${x + 16}px, ${y + 16}px)`; };
ui.close = () => { caption.classList.remove("on"); tallyList.hidden = true; tallyBtn.setAttribute("aria-expanded", "false"); };

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
